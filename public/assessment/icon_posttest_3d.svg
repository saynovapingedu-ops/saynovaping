<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgB" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="hiB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shieldGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="shieldInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
    <linearGradient id="goldB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <filter id="shadowB" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#064E3B" flood-opacity="0.35"/>
    </filter>
    <filter id="badgeShadowB" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 3D Clay Rounded Base Tile -->
  <rect x="10" y="10" width="108" height="108" rx="32" fill="url(#bgB)" filter="url(#shadowB)"/>
  <!-- Highlight curve -->
  <path d="M 24 16 Q 64 24 104 16 Q 110 20 112 28 Q 64 38 16 28 Q 18 20 24 16 Z" fill="url(#hiB)"/>

  <!-- 3D Golden Shield with Lungs -->
  <g filter="url(#badgeShadowB)">
    <!-- Golden Shield Frame -->
    <path d="M 64 22 C 84 22 94 28 94 48 C 94 72 74 88 64 94 C 54 88 34 72 34 48 C 34 28 44 22 64 22 Z" fill="url(#shieldGold)"/>
    <!-- Inner Shield Surface -->
    <path d="M 64 26 C 81 26 89 31 89 48 C 89 69 72 83 64 88 C 56 83 39 69 39 48 C 39 31 47 26 64 26 Z" fill="url(#shieldInner)"/>

    <!-- Healthy Lungs Illustration -->
    <!-- Trachea -->
    <rect x="62.5" y="37" width="3" height="11" rx="1.5" fill="#F43F5E"/>
    <!-- Left lung (from viewer) -->
    <path d="M 61 46 C 56 43 47 47 47 56 C 47 67 56 73 60 74 C 62 74 63 68 63 63 C 63 56 63 49 61 46 Z" fill="#FB7185"/>
    <path d="M 59 48 C 55 46 49 50 49 56 C 49 64 55 70 58 71 C 57 65 57 56 59 48 Z" fill="#FDA4AF"/>
    <!-- Right lung (from viewer) -->
    <path d="M 67 46 C 72 43 81 47 81 56 C 81 67 72 73 68 74 C 66 74 65 68 65 63 C 65 56 65 49 67 46 Z" fill="#FB7185"/>
    <path d="M 69 48 C 73 46 79 50 79 56 C 79 64 73 70 70 71 C 71 65 71 56 69 48 Z" fill="#FDA4AF"/>
  </g>

  <!-- Big 3D Badge 'B' -->
  <g filter="url(#badgeShadowB)">
    <circle cx="86" cy="86" r="20" fill="url(#goldB)"/>
    <circle cx="86" cy="86" r="16.5" fill="url(#bgB)"/>
    <text x="86" y="94" font-family="'Kanit', 'Arial Black', sans-serif" font-weight="900" font-size="22" fill="#022C22" text-anchor="middle">B</text>
    <text x="86" y="92.5" font-family="'Kanit', 'Arial Black', sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" text-anchor="middle">B</text>
  </g>

  <!-- Sparkles -->
  <circle cx="24" cy="34" r="3" fill="#FEF08A"/>
  <path d="M 102 32 Q 103 36 107 37 Q 103 38 102 42 Q 101 38 97 37 Q 101 36 102 32 Z" fill="#FEF08A"/>
</svg>